version: 2
updates:
  # bundle major updates monthly
  - package-ecosystem: npm
    cooldown:
      default-days: 7
      semver-patch-days: 3
    # explicitly set target branch to allow two npm configs
    # https://github.com/dependabot/dependabot-core/issues/1778#issuecomment-1988140219
    target-branch: canary
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)!:"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # bundle minor and patch updates monthly
  - package-ecosystem: npm
    cooldown:
      default-days: 7
      semver-patch-days: 3
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-updates:
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
