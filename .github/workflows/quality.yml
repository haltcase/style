name: Quality

on:
  pull_request:
  push:
    branches:
      - "canary"
      - "main"

jobs:
  commitlint:
    name: "Commitlint"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run commitlint check
        run: pnpm commitlint -f ${{ github.event.pull_request.base.sha }}

  eslint:
    name: "Formatting, linting, and types"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: ./.github/composite-actions/install

      - run: pnpm check
