saveExact: true

allowBuilds:
  unrs-resolver: true

catalog:
  oxfmt: 0.75.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "vite-plus>oxfmt": "catalog:"
  "vite-plus>oxlint": "catalog:"
  "vite-plus>oxlint-tsgolint": "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
