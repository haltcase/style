saveExact: true

allowBuilds:
  unrs-resolver: true

catalog:
  oxfmt: 0.60.0
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2004
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.11
  vite-plus: 0.2.9

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "vite-plus>oxfmt": "catalog:"
  "vite-plus>oxlint": "catalog:"
  "vite-plus>oxlint-tsgolint": "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
